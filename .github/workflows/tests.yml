name: tests

on:
  push:
    paths:
      - "tg-manager/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "tg-manager/**"

# Отмена устаревших прогонов — только для pull request.
#
# Раньше здесь стояло безусловное cancel-in-progress по ветке, и это отменяло
# проверку КОММИТА, а не лишний прогон: при работе пачкой каждый следующий push
# убивал прогон предыдущего. По факту из 20 последних push в рабочую ветку 15
# были отменены — то есть почти весь код уезжал в прод (ветка автодеплойная)
# вообще без прогона тестов, при ~5500 написанных тестов.
#
# Теперь у каждого push своя группа (по SHA), поэтому отменить его нечем: каждый
# коммит рабочей ветки проверяется. У pull request группа по номеру, и там
# отмена устаревших остаётся — новый push в PR делает прошлый прогон ненужным.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    # НАБОР ИДЁТ ЧЕТЫРЬМЯ ЧАСТЯМИ ПАРАЛЛЕЛЬНО (с 01.11.2026). Одним прогоном он
    # занимал 18–24 минуты и рос; части делятся по файлам с учётом веса
    # (tests/sharding.py, веса — tests/shard_weights.json), у каждой свой
    # раннер и своя база Postgres, то есть изоляция та же, что у одного
    # прогона. Что каждый файл попадает ровно в одну часть, проверяет
    # tests/test_sharding.py — иначе зелёный CI поверх невыполненного файла.
    #
    # fail-fast: false — красная часть не должна гасить остальные: иначе
    # список упавших тестов виден только по одной части, и на разбор уходит
    # повторный прогон.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: pytest (часть ${{ matrix.shard }} из 4)
    # Предел нужен: без него зависший тест удерживает runner до стандартного
    # шестичасового лимита GitHub и при частых push накапливает очередь
    # прогонов вместо быстрого красного сигнала.
    #
    # 23.10.2026: было 20 на весь набор, и набор в этот предел перестал
    # влезать. GitHub помечает убитую по таймауту работу как CANCELLED, а не
    # как failure, поэтому обрыв читался как «отменили лишний прогон» и никто
    # не заметил: ab76e05, 83526a8 и 7ba2711 оборвались ровно на 20м18с.
    # Ветка автодеплойная, то есть код уезжал в прод без прогона тестов.
    #
    # Теперь предел — на ЧАСТЬ: она идёт около четверти набора (5–7 минут
    # вместе с установкой), предел с запасом больше чем вчетверо. Рост виден
    # заранее: каждая часть печатает свои самые долгие тесты (--durations).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tg-manager

    # Живой Postgres для сквозных тестов.
    #
    # Файлы tests/*_postgres.py пропускаются целиком, если не задан
    # INFRAGRAM_TEST_DSN. Базы в CI не было, поэтому они не выполнялись НИ РАЗУ —
    # и накопили падения, которых никто не видел: рассылка с нулевой доставкой
    # рапортовала «выполнено», e2e метода «admin» подменял обёртку вместо
    # реально вызываемой функции и молча перестал проверять выдачу прав флоту,
    # четыре теста инвайта ждали статус, от которого продукт осознанно ушёл.
    # Именно эти тесты ловят ошибки СВЯЗЫВАНИЯ параметров (строка вместо
    # datetime, dict вместо jsonb), которые заглушка пула не видит в принципе —
    # так в прод уехал сломанный operation_bus.submit(scheduled_for=…),
    # убивавший все отложенные операции. Ветка автодеплойная, поэтому цена
    # непроверенного слоя здесь — прод.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        # Без health-check шаг тестов стартует раньше, чем база примет
        # соединение, и весь слой снова молча уйдёт в skip.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Кэш скачанных колёс pip: четыре части ставят одно и то же, и без
          # кэша каждая заново тянет aiogram/openai/anthropic/pydantic.
          cache: pip
          cache-dependency-path: tg-manager/requirements*.txt

      - name: Install deps (runtime subset + test tooling; telethon — отдельным шагом ниже)
        run: |
          python -m pip install --upgrade pip
          # Рантайм-зависимости, нужные для импорта хендлеров/сервисов в тестах.
          # telethon здесь НЕ ставим: в in-process тестах он застаблен в
          # tests/conftest.py, а подпроцессным тестам старта его ставит
          # отдельный шаг ниже (почему отдельный — там же в комментарии).
          # anthropic обязателен: tests/test_ai_claude.py делает безусловный
          # `import anthropic`, и без пакета падает СБОР всех тестов (весь прогон
          # красный, ни один тест tg-manager не выполняется). Он уже в
          # requirements.txt (anthropic>=0.69.0) — здесь просто не был продублирован.
          # qrcode — то же самое, но дешевле по последствиям: без него красные
          # только tests/test_qr_login_no_leaked_client.py (7 штук), зато весь
          # прогон ветки красный, и на его фоне настоящие падения не видны.
          # Тоже есть в requirements.txt (qrcode[pil]>=7.4).
          pip install \
            "aiogram==3.30.0" "asyncpg==0.29.0" aiohttp openai anthropic python-dotenv \
            openpyxl pypdf python-docx pycryptodome PySocks aiohttp-socks "qrcode[pil]" \
            pytest pytest-asyncio ruff

      # ЗАЧЕМ ОТДЕЛЬНЫМ ШАГОМ. Восемь тестов
      # tests/test_startup_survives_telegram_outage.py поднимают НАСТОЯЩИЙ
      # main.py отдельным процессом (проверяют, что мини-апп встаёт, когда
      # Telegram недоступен) — in-process заглушка из tests/conftest.py в
      # подпроцесс не попадает, и без пакета все восемь молча уходят в skip.
      # До 2026-10-22 они не выполнялись НИГДЕ: ни локально, ни здесь.
      #
      # ПОЧЕМУ НЕ В СПИСОК ВЫШЕ. `pip` при одном упавшем пакете не ставит НИ
      # ОДНОГО из списка — тогда прогон падает на `ModuleNotFoundError: pytest`,
      # и на разбор пустой поломки уходит время. Здесь же `continue-on-error`:
      # не собралось — основной набор уже стоит, прогон идёт, эти восемь снова
      # уходят в skip честно и видно в `-rs`.
      #
      # На in-process тесты пакет не влияет: `_TelethonFinder` из conftest
      # стоит в `sys.meta_path[0]` и перехватывает любой `import telethon`
      # раньше настоящего (проверено полным прогоном с установленным
      # telethon — тот же результат).
      - name: Install telethon (нужен только тестам старта подпроцессом)
        continue-on-error: true
        run: pip install "telethon==1.45.0" pyaes rsa

      # Обращение к несуществующему имени — это падение при исполнении строки,
      # и синтаксис его не ловит. Набор правил и обоснование, почему сюда не
      # берутся стилевые правила, — в tests/test_no_undefined_names.py.
      - name: Несуществующие имена (ruff)
        # Проверка всего дерева, а не части тестов, — достаточно одной части.
        if: matrix.shard == 1
        run: |
          ruff check . --select \
            F821,F822,F823,F601,F602,F632,F702,E711,E714,F502,F506,F522,F901 \
            --output-format concise

      - name: Run tests
        # Схему по базе раскатывают сами тесты (все schema*.sql по возрастанию
        # версии) — отдельного шага миграций не нужно.
        #
        # `-rf` добавляет в конец вывода список FAILED одной строкой на тест —
        # его забирает следующий шаг.
        #
        # `--durations=25` печатает самые долгие тесты. Это не любопытство:
        # набор уже однажды перерос предел по времени молча (см. комментарий
        # к timeout-minutes), и единственный способ увидеть рост заранее —
        # иметь имена долгих тестов в каждом прогоне.
        #
        # `--junitxml` — время каждого файла: из этих отчётов пересчитываются
        # веса частей (`python -m tests.sharding --update *.xml`).
        env:
          INFRAGRAM_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/infra
          INFRAGRAM_TEST_SHARD: ${{ matrix.shard }}/4
        run: |
          set -o pipefail
          python -m pytest tests/ -q -rf --durations=25 --junitxml=/tmp/junit-${{ matrix.shard }}.xml | tee /tmp/pytest-out.txt

      - name: Отчёт о времени (для весов частей)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: /tmp/junit-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 14

      # Какие тесты упали — аннотацией к прогону и в отчёт шага.
      #
      # ЗАЧЕМ. Узнать это из логов нельзя: архив логов отдаётся редиректом на
      # blob.core.windows.net, а туда агенту исходящий трафик закрыт; tail
      # джоба же занят логом контейнера postgres (он печатает каждый ERROR
      # схемы, сотни строк), и сводка pytest в него не попадает. На разбор
      # красного прогона уходил повторный полный прогон локально — восемь минут
      # и больше.
      #
      # ПОЧЕМУ АННОТАЦИЯ, А НЕ ТОЛЬКО ОТЧЁТ ШАГА. Отчёт шага
      # ($GITHUB_STEP_SUMMARY) виден в веб-интерфейсе, но через REST не
      # отдаётся: у чек-рана Actions `output.summary` пуст (проверено на
      # красном прогоне 2026-10-09 — и `commits/<sha>/check-runs`, и
      # `check-runs/<id>` вернули пустую сводку). А вот аннотации отдаются:
      # `gh api repos/<owner>/<repo>/check-runs/<job_id>/annotations`. Поэтому
      # список падений уходит ОДНОЙ аннотацией уровня error: перевод строки в
      # сообщении кодируется как %0A, и весь список читается одним запросом.
      - name: Сводка падений
        if: failure()
        run: |
          if [ ! -f /tmp/pytest-out.txt ]; then
            echo 'Прогон тестов не стартовал: упал предыдущий шаг (ruff, установка, сбор).' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FAILS=$( { grep -E '^(FAILED|ERROR) ' /tmp/pytest-out.txt \
                || echo 'строк FAILED нет — падение не в самих тестах (сбор или ошибка импорта)'; } \
              | head -80 )
          TOTAL=$(tail -n 3 /tmp/pytest-out.txt | tr '\n' ' ')
          {
            echo '## Упавшие тесты'
            echo '```'
            echo "$FAILS"
            echo '```'
            echo '## Итог'
            echo '```'
            echo "$TOTAL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Одна аннотация со всем списком: %0A — перевод строки внутри
          # сообщения аннотации, иначе GitHub оставит только первую строку.
          ENCODED=$(printf '%s\n%s' "$FAILS" "$TOTAL" \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Упавшие тесты (часть ${{ matrix.shard }})::${ENCODED}"
