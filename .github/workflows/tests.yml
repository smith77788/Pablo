name: tests

on:
  push:
    paths:
      - "tg-manager/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "tg-manager/**"

# Отмена устаревших прогонов — только для pull request.
#
# Раньше здесь стояло безусловное cancel-in-progress по ветке, и это отменяло
# проверку КОММИТА, а не лишний прогон: при работе пачкой каждый следующий push
# убивал прогон предыдущего. По факту из 20 последних push в рабочую ветку 15
# были отменены — то есть почти весь код уезжал в прод (ветка автодеплойная)
# вообще без прогона тестов, при ~5500 написанных тестов.
#
# Теперь у каждого push своя группа (по SHA), поэтому отменить его нечем: каждый
# коммит рабочей ветки проверяется. У pull request группа по номеру, и там
# отмена устаревших остаётся — новый push в PR делает прошлый прогон ненужным.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Полный набор обычно занимает около 8 минут. Без явного предела зависший
    # тест удерживает runner до стандартного шестичасового лимита GitHub и при
    # частых push накапливает очередь прогонов вместо быстрого красного сигнала.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tg-manager

    # Живой Postgres для сквозных тестов.
    #
    # Файлы tests/*_postgres.py пропускаются целиком, если не задан
    # INFRAGRAM_TEST_DSN. Базы в CI не было, поэтому они не выполнялись НИ РАЗУ —
    # и накопили падения, которых никто не видел: рассылка с нулевой доставкой
    # рапортовала «выполнено», e2e метода «admin» подменял обёртку вместо
    # реально вызываемой функции и молча перестал проверять выдачу прав флоту,
    # четыре теста инвайта ждали статус, от которого продукт осознанно ушёл.
    # Именно эти тесты ловят ошибки СВЯЗЫВАНИЯ параметров (строка вместо
    # datetime, dict вместо jsonb), которые заглушка пула не видит в принципе —
    # так в прод уехал сломанный operation_bus.submit(scheduled_for=…),
    # убивавший все отложенные операции. Ветка автодеплойная, поэтому цена
    # непроверенного слоя здесь — прод.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        # Без health-check шаг тестов стартует раньше, чем база примет
        # соединение, и весь слой снова молча уйдёт в skip.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (runtime subset + test tooling; telethon is stubbed in conftest)
        run: |
          python -m pip install --upgrade pip
          # Рантайм-зависимости, нужные для импорта хендлеров/сервисов в тестах.
          # telethon НЕ ставим — он застаблен в tests/conftest.py (и pyaes не собирается).
          # anthropic обязателен: tests/test_ai_claude.py делает безусловный
          # `import anthropic`, и без пакета падает СБОР всех тестов (весь прогон
          # красный, ни один тест tg-manager не выполняется). Он уже в
          # requirements.txt (anthropic>=0.69.0) — здесь просто не был продублирован.
          # qrcode — то же самое, но дешевле по последствиям: без него красные
          # только tests/test_qr_login_no_leaked_client.py (7 штук), зато весь
          # прогон ветки красный, и на его фоне настоящие падения не видны.
          # Тоже есть в requirements.txt (qrcode[pil]>=7.4).
          pip install \
            "aiogram==3.30.0" "asyncpg==0.29.0" aiohttp openai anthropic python-dotenv \
            openpyxl pypdf python-docx pycryptodome PySocks aiohttp-socks "qrcode[pil]" \
            pytest pytest-asyncio ruff

      # Обращение к несуществующему имени — это падение при исполнении строки,
      # и синтаксис его не ловит. Набор правил и обоснование, почему сюда не
      # берутся стилевые правила, — в tests/test_no_undefined_names.py.
      - name: Несуществующие имена (ruff)
        run: |
          ruff check . --select \
            F821,F822,F823,F601,F602,F632,F702,E711,E714,F502,F506,F522,F901 \
            --output-format concise

      - name: Run tests
        # Схему по базе раскатывают сами тесты (все schema*.sql по возрастанию
        # версии) — отдельного шага миграций не нужно.
        #
        # `-rf` добавляет в конец вывода список FAILED одной строкой на тест —
        # его забирает следующий шаг.
        env:
          INFRAGRAM_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/infra
        run: |
          set -o pipefail
          python -m pytest tests/ -q -rf | tee /tmp/pytest-out.txt

      # Какие тесты упали — аннотацией к прогону и в отчёт шага.
      #
      # ЗАЧЕМ. Узнать это из логов нельзя: архив логов отдаётся редиректом на
      # blob.core.windows.net, а туда агенту исходящий трафик закрыт; tail
      # джоба же занят логом контейнера postgres (он печатает каждый ERROR
      # схемы, сотни строк), и сводка pytest в него не попадает. На разбор
      # красного прогона уходил повторный полный прогон локально — восемь минут
      # и больше.
      #
      # ПОЧЕМУ АННОТАЦИЯ, А НЕ ТОЛЬКО ОТЧЁТ ШАГА. Отчёт шага
      # ($GITHUB_STEP_SUMMARY) виден в веб-интерфейсе, но через REST не
      # отдаётся: у чек-рана Actions `output.summary` пуст (проверено на
      # красном прогоне 2026-10-09 — и `commits/<sha>/check-runs`, и
      # `check-runs/<id>` вернули пустую сводку). А вот аннотации отдаются:
      # `gh api repos/<owner>/<repo>/check-runs/<job_id>/annotations`. Поэтому
      # список падений уходит ОДНОЙ аннотацией уровня error: перевод строки в
      # сообщении кодируется как %0A, и весь список читается одним запросом.
      - name: Сводка падений
        if: failure()
        run: |
          if [ ! -f /tmp/pytest-out.txt ]; then
            echo 'Прогон тестов не стартовал: упал предыдущий шаг (ruff, установка, сбор).' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FAILS=$( { grep -E '^(FAILED|ERROR) ' /tmp/pytest-out.txt \
                || echo 'строк FAILED нет — падение не в самих тестах (сбор или ошибка импорта)'; } \
              | head -80 )
          TOTAL=$(tail -n 3 /tmp/pytest-out.txt | tr '\n' ' ')
          {
            echo '## Упавшие тесты'
            echo '```'
            echo "$FAILS"
            echo '```'
            echo '## Итог'
            echo '```'
            echo "$TOTAL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Одна аннотация со всем списком: %0A — перевод строки внутри
          # сообщения аннотации, иначе GitHub оставит только первую строку.
          ENCODED=$(printf '%s\n%s' "$FAILS" "$TOTAL" \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Упавшие тесты::${ENCODED}"
