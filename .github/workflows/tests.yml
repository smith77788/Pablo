name: tests

on:
  push:
    paths:
      - "tg-manager/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "tg-manager/**"

# Отмена устаревших прогонов — только для pull request.
#
# Раньше здесь стояло безусловное cancel-in-progress по ветке, и это отменяло
# проверку КОММИТА, а не лишний прогон: при работе пачкой каждый следующий push
# убивал прогон предыдущего. По факту из 20 последних push в рабочую ветку 15
# были отменены — то есть почти весь код уезжал в прод (ветка автодеплойная)
# вообще без прогона тестов, при ~5500 написанных тестов.
#
# Теперь у каждого push своя группа (по SHA), поэтому отменить его нечем: каждый
# коммит рабочей ветки проверяется. У pull request группа по номеру, и там
# отмена устаревших остаётся — новый push в PR делает прошлый прогон ненужным.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tg-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (runtime subset + test tooling; telethon is stubbed in conftest)
        run: |
          python -m pip install --upgrade pip
          # Рантайм-зависимости, нужные для импорта хендлеров/сервисов в тестах.
          # telethon НЕ ставим — он застаблен в tests/conftest.py (и pyaes не собирается).
          # anthropic обязателен: tests/test_ai_claude.py делает безусловный
          # `import anthropic`, и без пакета падает СБОР всех тестов (весь прогон
          # красный, ни один тест tg-manager не выполняется). Он уже в
          # requirements.txt (anthropic>=0.69.0) — здесь просто не был продублирован.
          pip install \
            "aiogram==3.30.0" "asyncpg==0.29.0" aiohttp openai anthropic python-dotenv \
            openpyxl pypdf python-docx pycryptodome PySocks aiohttp-socks \
            pytest pytest-asyncio ruff

      # Обращение к несуществующему имени — это падение при исполнении строки,
      # и синтаксис его не ловит. Набор правил и обоснование, почему сюда не
      # берутся стилевые правила, — в tests/test_no_undefined_names.py.
      - name: Несуществующие имена (ruff)
        run: |
          ruff check . --select \
            F821,F822,F823,F601,F602,F632,F702,E711,E714,F502,F506,F522,F901 \
            --output-format concise

      - name: Run tests
        run: python -m pytest tests/ -q
